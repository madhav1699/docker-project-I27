apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-deployment
  namespace: madhav
  labels:
    app: comment-service
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comment-service
      env: dev
  template:
    metadata:
      labels:
        app: comment-service
        env: dev
    spec:
      containers:
        - name: commentctn
          image: devopswithcloudhub/i27helpdesk-comment:v1
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: commentsecret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 30
