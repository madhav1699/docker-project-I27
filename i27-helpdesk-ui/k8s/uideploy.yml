apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: madhav
  labels:
    app: ui
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
      env: dev
  template:
    metadata:
      labels:
        app: ui
        env: dev
    spec:
      containers:
        - name: uictn
          image: madhav2026/i27helpdesk-ui:v1
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
