apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: madhav
  labels:
    app: gateway-service
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
      env: dev
  template:
    metadata:
      labels:
        app: gateway-service
        env: dev
    spec:
      containers:
        - name: gatewayctn
          image: devopswithcloudhub/i27helpdesk-gateway:v1
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: gatewaysecret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
